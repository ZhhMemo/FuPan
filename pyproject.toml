[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fupan"
version = "0.1.0"
description = "复盘 · A 股历史决策训练平台"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    # ── Web / 服务层 ──
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "gunicorn>=22",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # ── 存储 / 数据处理 ──
    "duckdb>=1.1",
    "pyarrow>=17",
    "pandas>=2.2",
    "numpy>=1.26",
    # ── 数据源 ──
    "baostock>=0.8.8",
    # 注：akshare 归入可选 extra（见下方 [project.optional-dependencies].akshare）——
    #     其为「按需补充」，且其依赖 jsonpath 仅以 sdist 发布，在部分环境安装受阻；
    #     放入 extra 可保证核心依赖（Baostock）始终可安装。详见 docs/07 与交付报告。
    # ── LLM ──
    "openai>=1.0",
    "httpx>=0.27",
    # ── 认证 / 安全 ──
    "passlib[argon2]>=1.7",
    "itsdangerous>=2.2",
    "slowapi>=0.1.9",
    # ── 基础设施 ──
    "apscheduler>=3.10",
    "filelock>=3.15",
    "python-dateutil>=2.9",
    "pytz>=2024.1",
    "structlog>=24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]
# 按需补充数据源（M5 1 分钟线 / 龙虎榜）。绝不用于定时任务。
# 安装：pip install -e ".[akshare]"
akshare = [
    "akshare>=1.14",
]

[tool.setuptools]
package-dir = { "" = "backend" }

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
mypy_path = "backend"
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = false
# 第三方库无类型桩，逐模块放宽（保留自身代码检查）
[[tool.mypy.overrides]]
module = ["pandas.*", "numpy.*", "duckdb.*", "baostock.*", "akshare.*", "apscheduler.*", "structlog.*", "filelock.*"]
ignore_missing_imports = true
